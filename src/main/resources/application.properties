# Using Llama 3.2 model via Ollama
quarkus.langchain4j.ollama.chat-model.model-id=llama3.2
%dev.quarkus.langchain4j.ollama.base-url=http://localhost:11434

# Short, deterministic tool calls; no second LLM pass after the tool.
quarkus.langchain4j.ollama.chat-model.temperature=0
quarkus.langchain4j.ollama.timeout=30s
quarkus.langchain4j.ollama.chat-model.num-predict=128
quarkus.langchain4j.ollama.chat-model.model-options.num-ctx=2048

# Logging requests and responses
%dev.quarkus.langchain4j.ollama.log-requests=true
%dev.quarkus.langchain4j.ollama.log-responses=true

# Enable OpenTelemetry log export to Loki
quarkus.otel.logs.enabled=true

# Fix Grafana port for stable observability links
quarkus.observability.lgtm.grafana-port=3001

# Quinoa Configuration for React Frontend
quarkus.quinoa.ui-dir=src/main/webui
# Keep backend/API routes out of the Vite development proxy.
quarkus.quinoa.ignored-path-prefixes=/trade,/q
quarkus.quinoa.package-manager-install=true
quarkus.quinoa.package-manager-install.node-version=20.11.0
quarkus.quinoa.package-manager=npm
quarkus.quinoa.build-dir=dist
